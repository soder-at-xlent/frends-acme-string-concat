name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore
        run: dotnet restore Frends.Acme.StringConcat.sln

      - name: Build
        run: dotnet build Frends.Acme.StringConcat.sln -c Release --no-restore

      - name: Test
        run: dotnet test Frends.Acme.StringConcat.sln -c Release --no-build --verbosity normal
